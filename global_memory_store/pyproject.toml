[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-memory-store"
version = "0.1.0"
description = "Standalone shared memory store for MIRA instances"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "hypercorn>=0.16",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.2",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["global_memory_store*"]
